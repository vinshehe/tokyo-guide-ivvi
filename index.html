<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>IVVI Tokyo Reco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A;
    --ink-soft:#8A8A85;
    --line:#EBEBE6;
    --card:#FFFFFF;
    --accent:#FC7200;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button{font-family:'Instrument Sans',sans-serif;}

  #map-wrapper{position:fixed;inset:0;z-index:0;background:#F4F4F1;}
  #map{width:100%;height:100%;}

  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:600;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0 150px;
    pointer-events:none;
    display:flex;align-items:flex-start;justify-content:flex-start;gap:12px;
  }
  .topbar > *{pointer-events:auto;}
  .brand{
    position:fixed;top:0;left:0;z-index:601;
    background:#fff;border-radius:0;
    padding:10px 14px;
    padding-top:calc(env(safe-area-inset-top,0px) + 10px);
    padding-left:calc(env(safe-area-inset-left,0px) + 14px);
    box-shadow:0 2px 14px rgba(0,0,0,0.08);
    display:flex;align-items:center;
    cursor:pointer;transition:transform .12s ease;
  }
  .brand:hover{background:#F7F7F5;}
  .brand:active{transform:scale(.96);}
  .brand svg{height:26.4px;width:auto;display:block;}
  @media (min-width: 880px){ .brand svg{height:31.68px;} }
  .place-count-desktop{
    display:none;font-size:11.5px;color:var(--ink-soft);font-weight:600;
    background:#fff;padding:8px 12px;border-radius:0;box-shadow:0 2px 14px rgba(0,0,0,0.08);
    align-self:center;white-space:nowrap;
  }
  @media (min-width: 880px){ .place-count-desktop{display:flex;align-items:center;} }
  .place-count-mobile{
    font-size:11px;color:var(--ink-soft);font-weight:600;text-align:center;margin-bottom:8px;
  }
  @media (min-width: 880px){ .place-count-mobile{display:none;} }
  .search-wrap{flex:1 1 auto;max-width:380px;}
  .search-row{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border-radius:12px;padding:11px 14px;
    box-shadow:0 2px 14px rgba(0,0,0,0.08);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .search-row:focus-within{box-shadow:0 6px 22px rgba(0,0,0,0.16);transform:scale(1.02);}
  .search-row svg{flex:0 0 auto;opacity:0.4;}
  .search-row input{
    border:none;outline:none;flex:1;font-family:'Instrument Sans',sans-serif;
    font-size:15px;color:var(--ink);background:transparent;font-weight:500;
  }

  .locate-btn{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);right:20px;z-index:600;
    width:40px;height:40px;border-radius:50%;background:#fff;border:none;
    box-shadow:0 2px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s ease, transform .15s ease;
  }
  .locate-btn:hover{background:#F4F4F1;transform:scale(1.06);}
  @media (min-width: 880px){ .locate-btn{right:490px;} }

  .nb-close-anchor{position:absolute;z-index:16;}
  .nb-close-btn{
    width:34px;height:34px;border-radius:50%;background:#fff;border:none;
    box-shadow:0 2px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--ink);cursor:pointer;transition:background .15s ease, transform .15s ease;
    pointer-events:auto;
  }
  .nb-close-btn:hover{background:#F4F4F1;transform:scale(1.08);}

  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:700;
    background:var(--card);
    border-radius:20px 20px 0 0;
    box-shadow:0 -10px 34px rgba(0,0,0,0.12);
    height:88vh;
    overflow-x:hidden;
    transform:translateY(calc(88vh - 140px));
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    touch-action:none;
    display:flex;flex-direction:column;
  }
  .sheet.dragging{transition:none;}
  .sheet.state-half{transform:translateY(46vh);}
  .sheet.state-full{transform:translateY(0);}

  .handle-zone{flex:0 0 auto;padding:12px 20px 8px;cursor:grab;}
  .handle-bar{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px;}
  .sheet-count{font-size:10.5px;color:var(--ink-soft);font-weight:600;}

  .filter-row{flex:0 0 auto;padding:2px 0 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:hidden;}
  .filter-row.hidden{display:none;}
  .chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;padding-left:20px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;font-size:12px;font-weight:600;letter-spacing:0.01em;
    padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;transition:all .15s ease;
  }
  .chip:hover{border-color:var(--ink);color:var(--ink);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .sheet-body{flex:1 1 auto;overflow-y:hidden;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 20px 50px;max-width:100%;}
  .sheet.state-full .sheet-body{overflow-y:auto;}

  @keyframes listIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .list-anim{animation:listIn .25s ease;}

  .section-label{
    font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--ink-soft);margin:22px 0 12px;
  }
  .section-label:first-child{margin-top:6px;}

  .card{display:flex;gap:14px;padding:16px 20px;margin:0 -20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s ease;max-width:calc(100% + 40px);box-sizing:border-box;}
  .card:hover{background:#EFEEE8;}
  .card:last-child{border-bottom:none;}
  .thumb{
    flex:0 0 auto;width:68px;height:68px;border-radius:12px;
    background:#F4F4F1 center/cover no-repeat;color:var(--ink);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:22px;overflow:hidden;
  }
  .card-body{flex:1 1 auto;min-width:0;}
  .card-name{font-weight:700;font-size:40px;letter-spacing:-0.02em;line-height:1.02;margin:0 0 6px;overflow-wrap:break-word;word-break:break-word;}
  .card-meta{font-size:12px;color:var(--ink-soft);margin:0 0 6px;font-weight:600;}
  .card-note{font-size:13.5px;line-height:1.5;color:#3A3A36;margin:0 0 8px;}
  .card-link{
    display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:50%;background:#F4F4F1;color:var(--ink);transition:background .15s ease;
  }
  .card-link:hover{background:var(--ink);color:#fff;}

  .nb-bar{
    display:none;
    position:fixed;left:0;right:0;bottom:140px;z-index:650;
    padding:10px 0 12px;pointer-events:none;
  }
  .nb-bar-inner{
    display:flex;gap:10px;overflow-x:auto;overflow-y:visible;pointer-events:auto;
    scrollbar-width:none;padding:6px 0 2px 20px;
  }
  .nb-bar-inner::-webkit-scrollbar{display:none;}
  .nb-card{
    position:relative;flex:0 0 auto;width:375px;height:190px;border-radius:16px;overflow:hidden;
    background:#F4F4F1 center/cover no-repeat;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.14);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .nb-card:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 10px 26px rgba(0,0,0,.24);}
  .nb-card-count{
    position:absolute;top:9px;left:9px;background:rgba(255,255,255,.25);backdrop-filter:blur(4px);
    color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;z-index:2;
  }
  .nb-card-name{
    position:absolute;left:14px;right:14px;bottom:26px;color:#fff;font-weight:400;font-size:48px;
    letter-spacing:-0.02em;line-height:1.05;z-index:2;overflow-wrap:break-word;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .nb-card-jp{
    position:absolute;left:14px;right:14px;bottom:10px;color:rgba(255,255,255,.8);
    font-size:18px;font-weight:500;z-index:2;
  }

  @media (min-width: 880px){
    .nb-bar{ right:470px; bottom:0; padding:10px 0 20px; }
    .nb-card{ width:430px; height:218px; }
  }

  .back-row{
    display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);
    cursor:pointer;margin:8px 0 18px;transition:opacity .15s ease;
  }
  .back-row:hover{opacity:.6;}
  .nb-hero-sticky{
    position:sticky;top:0;z-index:20;margin:0 -20px 0;
  }
  #list > .chips{
    position:sticky;z-index:15;background:#fff;padding-top:10px;padding-bottom:10px;
    border-bottom:1px solid var(--line);margin:0 -20px 4px;
  }
  .nb-hero{
    position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;
    background:#F4F4F1 center/cover no-repeat;
  }
  .nb-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,0) 55%);}
  .nb-hero-close{
    position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
    background:rgba(0,0,0,.4);backdrop-filter:blur(4px);border:none;color:#fff;
    font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    z-index:3;transition:background .15s ease;box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .nb-hero-close:hover{background:rgba(0,0,0,.6);}
  .nb-hero-content{position:absolute;left:0;right:0;bottom:0;padding:20px;color:#fff;z-index:2;}
  .nb-hero-name{font-size:28px;font-weight:700;letter-spacing:-0.01em;margin-bottom:2px;}
  .nb-hero-jp{font-size:14px;color:rgba(255,255,255,.85);margin-bottom:10px;}
  .nb-hero-note{font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.92);}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:14px;font-weight:600;}

  .locate-dot{position:absolute;transform:translate(-50%,-50%);pointer-events:none;}
  .locate-dot .pulse{
    position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;
    background:rgba(26,115,232,.35);animation:pulseGlow 1.6s ease-out infinite;
  }
  .locate-dot .dot{
    position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;
    background:#1a73e8;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.3);
  }
  @keyframes pulseGlow{0%{transform:scale(.4);opacity:.8;}100%{transform:scale(1.8);opacity:0;}}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    position:relative;background:#fff;border-radius:22px;max-width:480px;width:100%;
    max-height:85vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-close{
    position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
    background:#F4F4F1;border:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:3;transition:background .15s ease;
  }
  .modal-close:hover{background:var(--line);}
  .modal-carousel-wrap{position:relative;margin-bottom:14px;}
  .modal-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:14px;background:#F4F4F1;margin-bottom:0;}
  .modal-carousel::-webkit-scrollbar{display:none;}
  .modal-single-photo{width:100%;height:220px;object-fit:cover;border-radius:14px;display:block;}
  .modal-cat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
  .modal-name{font-size:26px;font-weight:700;letter-spacing:-0.01em;margin-bottom:6px;}
  .modal-rating{font-size:13px;font-weight:600;margin-bottom:8px;}
  .modal-hours{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;font-weight:600;}
  .modal-note{font-size:14px;line-height:1.6;color:#2A2A26;margin-bottom:18px;}
  .modal-cta{
    display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;
    border-radius:50%;background:var(--ink);color:#fff;transition:background .15s ease;
  }
  .modal-cta:hover{background:var(--accent);}

  .dot-pin{width:15px;height:15px;border-radius:50%;background:#000;border:2px solid #fff;}

  @media (min-width: 880px){
    .topbar{right:470px;}
    .sheet{
      left:auto;right:0;top:0;bottom:0;width:450px;height:100vh;
      border-radius:0;box-shadow:-6px 0 30px rgba(0,0,0,0.08);
      transform:none !important;border-left:1px solid var(--line);
    }
    .sheet .sheet-body{overflow-y:auto;}
    .handle-zone{cursor:default;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px 8px;}
    .handle-bar{display:none;}
    .filter-row{padding:2px 0 12px;}
    .chips{padding-left:24px;}
    .sheet-body{padding:8px 24px 60px;}
    .card{margin:0 -24px;padding:16px 24px;max-width:calc(100% + 48px);}
    .nb-hero-sticky{margin:0 -24px 0;}
    #list > .chips{margin:0 -24px 4px;}
  }

  @media (max-width: 879px){
    .nb-bar{display:none;}
    .nb-hero-sticky{position:static;}
    #list > .chips{top:0 !important;}

    .search-wrap{
      position:fixed;left:16px;right:16px;bottom:calc(140px + 12px);
      max-width:none;z-index:650;
    }
    .search-row:focus-within{transform:scale(1.06);}

    .locate-btn{
      top:calc(env(safe-area-inset-top,0px) + 4px);
      right:16px;
    }
  }
</style>
</head>
<body>

  </div>
  <div class="place-count-desktop" id="sheetCountDesktop">Loading…</div>
  <div class="search-wrap">
    <div class="search-row">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search…" />
    </div>
  </div>

// Click-and-drag horizontal scroll for mouse users (touch already scrolls natively).
function enableDragScroll(el){
  if (!el || el._dragScrollBound) return;
  el._dragScrollBound = true;
  let isDown = false, startX = 0, startScroll = 0, moved = false;
  el.addEventListener('mousedown', (e) => {
    isDown = true; moved = false;
    startX = e.pageX;
    startScroll = el.scrollLeft;
    el.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 4) moved = true;
    el.scrollLeft = startScroll - dx;
  });
  window.addEventListener('mouseup', () => {
    isDown = false;
    el.style.cursor = '';
  });
  // Suppress the click that follows a drag so cards don't get accidentally opened.
  el.addEventListener('click', (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

function distKm(lat1, lng1, lat2, lng2){
  const R = 6371, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function assignPlacesToNeighborhoods(){
  const neighborhoods = PLACES.filter(p => p.c === 'nb' && p.lat != null);
  neighborhoods.forEach(n => n.nearby = []);
  PLACES.forEach(p => {
    if (p.c === 'nb' || p.lat == null) return;
    let best = null, bestD = Infinity;
    neighborhoods.forEach(n => {
      const d = distKm(p.lat, p.lng, n.lat, n.lng);
      if (d < bestD) { bestD = d; best = n; }
    });
    if (best) best.nearby.push(PLACES.indexOf(p));
  });
}

let currentZoomShowName = false;
const _measureCanvas = document.createElement('canvas');
function measureTextWidth(text, font){
  const ctx = _measureCanvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}

function pinIconUrl(place, active){
  if (place.c === 'nb') {
    // Neighborhoods: plain black name-only chip, no emoji, no rating. Unaffected by active state.
    const font = '700 12px Arial';
    const textW = measureTextWidth(place.n, font);
    const w = Math.ceil(textW + 24), h = 25;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="${w}" height="${h}" rx="${h/2}" fill="#000"/><text x="${w/2}" y="17" font-family="Arial" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">${place.n}</text></svg>`;
    return { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), w, h };
  }

  const bg = active ? '#FC7200' : '#FFFFFF';
  const fg = active ? '#FFFFFF' : '#0A0A0A';
  const stroke = active ? 'none' : '#E5E3DD';
  const cat = CATEGORIES[place.c];

  if (!currentZoomShowName) {
    // Zoomed out: compact emoji-only chip to avoid clutter.
    const s = 30;
    const strokeAttr = stroke === 'none' ? '' : ` stroke="${stroke}" stroke-width="1.5"`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}"><circle cx="${s/2}" cy="${s/2}" r="${s/2-1.5}" fill="${bg}"${strokeAttr}/><text x="${s/2}" y="${s/2+6}" font-size="17" text-anchor="middle">${cat.emoji}</text></svg>`;
    return { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), w: s, h: s };
  }

  // Zoomed in: emoji + name pill, regular weight.
  const font = '400 12px Arial';
  const nameW = measureTextWidth(place.n, font);
  const w = Math.ceil(32 + nameW + 14), h = 26;
  const strokeAttr = stroke === 'none' ? '' : ` stroke="${stroke}" stroke-width="1.5"`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="${w}" height="${h}" rx="${h/2}" fill="${bg}"${strokeAttr}/><text x="14" y="17" font-size="15" text-anchor="start">${cat.emoji}</text><text x="32" y="17" font-family="Arial" font-size="12" font-weight="400" fill="${fg}" text-anchor="start">${place.n}</text></svg>`;
  return { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), w, h };
}

function markerIconOptions(place, active){
  const { url, w, h } = pinIconUrl(place, active);
  return { url, scaledSize: new google.maps.Size(w, h), anchor: new google.maps.Point(w/2, h/2) };
}

function updateMarkerIcon(idx, active){
  const marker = markers[idx];
  const place = PLACES[idx];
  if (!marker || !place) return;
  marker.setIcon(markerIconOptions(place, active));
}

function refreshAllMarkerIcons(){
  Object.entries(markers).forEach(([idxStr, m]) => {
    const idx = Number(idxStr);
    const place = PLACES[idx];
    if (!place) return;
    m.setIcon(markerIconOptions(place, idx === selectedIdx));
  });
}

// Local cache for the (now rarely-hit) live location lookup — only place
// entries without hardcoded lat/lng ever reach this. Photos, overview and
// hours are static data baked into PLACES directly; no live fetch for those.
const CACHE_KEY = 'tokyo-guide-place-cache-v1';
const LOCATION_TTL_MS = 90 * 24 * 60 * 60 * 1000; // 90 days

function loadCache(){
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (err) {
    console.warn('Cache read failed', err);
    return {};
  }
}

function saveCache(){
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(placeCache));
  } catch (err) {
    console.warn('Cache write failed', err);
  }
}

const placeCache = loadCache();

async function initMap(){
  const { Map } = await google.maps.importLibrary("maps");
  const { Place } = await google.maps.importLibrary("places");
  PlaceClass = Place;

  class LocationDot extends google.maps.OverlayView {
    constructor(position){ super(); this.position = position; this.div = null; }
    onAdd(){
      this.div = document.createElement('div');
      this.div.className = 'locate-dot';
      this.div.innerHTML = '<div class="pulse"></div><div class="dot"></div>';
      this.getPanes().overlayMouseTarget.appendChild(this.div);
    }
    draw(){
      const proj = this.getProjection();
      if (!proj || !this.div) return;
      const pos = proj.fromLatLngToDivPixel(new google.maps.LatLng(this.position));
      this.div.style.left = pos.x + 'px';
      this.div.style.top = pos.y + 'px';
    }
    onRemove(){ if (this.div) { this.div.remove(); this.div = null; } }
  }
  MyLocationOverlayClass = LocationDot;

  // Anchored to the neighborhood's marker so it tracks the map instead of sitting
  // at a fixed screen position (which used to drift away from the chip on pan).
  class NbCloseOverlay extends google.maps.OverlayView {
    constructor(position, onClick){ super(); this.position = position; this.onClick = onClick; this.div = null; }
    onAdd(){
      this.div = document.createElement('div');
      this.div.className = 'nb-close-anchor';
      this.div.innerHTML = '<button class="nb-close-btn" title="Close neighborhood view">✕</button>';
      this.div.querySelector('button').addEventListener('click', this.onClick);
      this.getPanes().floatPane.appendChild(this.div);
    }
    draw(){
      const proj = this.getProjection();
      if (!proj || !this.div) return;
      const pos = proj.fromLatLngToDivPixel(new google.maps.LatLng(this.position));
      this.div.style.left = pos.x + 'px';
      this.div.style.top = (pos.y + 22) + 'px';
      this.div.style.transform = 'translate(-50%, 0)';
    }
    onRemove(){ if (this.div) { this.div.remove(); this.div = null; } }
  }
  NbCloseOverlayClass = NbCloseOverlay;

  map = new Map(document.getElementById('map'), {
    center: { lat: 35.6812, lng: 139.7180 },
    zoom: 12,
    styles: MAP_STYLE,
    disableDefaultUI: true,
    zoomControl: true,
    zoomControlOptions: { position: google.maps.ControlPosition.LEFT_BOTTOM }
  });

  currentZoomShowName = map.getZoom() >= 15;
  map.addListener('zoom_changed', () => {
    const showName = map.getZoom() >= 15;
    if (showName !== currentZoomShowName) {
      currentZoomShowName = showName;
      refreshAllMarkerIcons();
    }
  });

  document.getElementById('locateBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => {
      const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      map.panTo(coords);
      map.setZoom(15);
      if (myLocationOverlay) myLocationOverlay.setMap(null);
      myLocationOverlay = new MyLocationOverlayClass(coords);
      myLocationOverlay.setMap(map);
    }, (err) => console.warn('Geolocation failed', err));
  });

  let remaining = PLACES.length;

  await Promise.all(PLACES.map(async (place, idx) => {
    // Places added with hardcoded coordinates (no resolvable place_id, e.g. from a
    // shared Maps link) skip the API call entirely — zero GetPlaceRequest cost.
    if (place.lat != null && place.lng != null) {
      createMarker(place, idx);
      remaining--;
      if (remaining === 0) {
        saveCache();
        assignPlacesToNeighborhoods(); renderNeighborhoodBar(); render(); setCountText(PLACES.length + ' places for now');
      }
      else setCountText('Loading… (' + (PLACES.length - remaining) + '/' + PLACES.length + ')');
      return;
    }
    const cached = placeCache[place.p];
    const locationFresh = cached && cached.lat != null && (Date.now() - (cached.locFetchedAt || 0)) < LOCATION_TTL_MS;
    if (locationFresh) {
      place.lat = cached.lat;
      place.lng = cached.lng;
    } else {
      try {
        const p = new PlaceClass({ id: place.p });
        await p.fetchFields({ fields: ['location'] });
        place.lat = p.location.lat();
        place.lng = p.location.lng();
        placeCache[place.p] = { ...(placeCache[place.p] || {}), lat: place.lat, lng: place.lng, locFetchedAt: Date.now() };
      } catch (err) {
        console.warn('Place lookup failed for', place.n, err);
      }
    }
    createMarker(place, idx);
    remaining--;
    if (remaining === 0) {
      saveCache();
      assignPlacesToNeighborhoods(); renderNeighborhoodBar(); render(); setCountText(PLACES.length + ' places for now');
    }
    else setCountText('Loading… (' + (PLACES.length - remaining) + '/' + PLACES.length + ')');
  }));
}

function createMarker(place, idx){
  if (place.lat == null) return;
  const marker = new google.maps.Marker({ position: { lat: place.lat, lng: place.lng }, map, icon: markerIconOptions(place, false), title: place.n });
  marker.addListener('click', () => {
    if (place.c === 'nb') openNeighborhoodDetail(place);
    else openModal(place, idx);
  });
  markers[idx] = marker;
}

function mapsUrl(place){ return place.link || `https://www.google.com/maps/place/?q=place_id:${place.p}`; }

function renderModalContent(place){
  const cat = CATEGORIES[place.c];
  let photo = '';
  if (place.photos && place.photos.length > 1) {
    photo = `<div class="modal-carousel-wrap"><div class="modal-carousel">${
      place.photos.map(src => `<img class="modal-single-photo" style="scroll-snap-align:start;flex:0 0 100%;" src="${src}" alt="">`).join('')
    }</div></div>`;
  } else if (place.photos && place.photos.length === 1) {
    photo = `<div class="modal-carousel-wrap"><img class="modal-single-photo" src="${place.photos[0]}" alt=""></div>`;
  }
  const overview = place.overview ? `<p class="modal-note">${place.overview}</p>` : '';
  const hours = place.hours ? `<div class="modal-hours">${place.hours.join('<br>')}</div>` : '';

  document.getElementById('modalBox').innerHTML = `
    <button class="modal-close" id="modalCloseBtn">✕</button>
    ${photo}
    <div class="modal-cat">${cat.emoji} ${cat.label}</div>
    <div class="modal-name">${place.n}</div>
    ${overview}
    ${hours}
    <p class="modal-note">${place.note}</p>
    <a class="modal-cta" href="${mapsUrl(place)}" target="_blank" rel="noopener" title="Open in Google Maps">${PIN_ICON}</a>
  `;
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
}

function openModal(place, idx){
  if (selectedIdx != null && selectedIdx !== idx) updateMarkerIcon(selectedIdx, false);
  selectedIdx = idx;
  updateMarkerIcon(idx, true);
  renderModalContent(place);
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){
  if (selectedIdx != null) { updateMarkerIcon(selectedIdx, false); selectedIdx = null; }
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

let nbCircleAnimFrame = null;

function animateNbCircle(){
  const start = performance.now();
  function step(now){
    if (!nbCircle) return;
    const t = (now - start) / 1000;
    const wave = (Math.sin(t * 1.4) + 1) / 2; // 0..1
    nbCircle.setOptions({
      radius: 850 + wave * 150,
      fillOpacity: 0.04 + wave * 0.06,
      strokeOpacity: 0.3 + wave * 0.3
    });
    nbCircleAnimFrame = requestAnimationFrame(step);
  }
  nbCircleAnimFrame = requestAnimationFrame(step);
}

function stopNbCircleAnim(){
  if (nbCircleAnimFrame) { cancelAnimationFrame(nbCircleAnimFrame); nbCircleAnimFrame = null; }
}

async function openNeighborhoodDetail(nb){
  detailNeighborhood = nb;
  render();
  if (nbCloseOverlay) { nbCloseOverlay.setMap(null); nbCloseOverlay = null; }
  if (nb.lat != null) {
    map.panTo({ lat: nb.lat, lng: nb.lng });
    map.setZoom(15);
    stopNbCircleAnim();
    if (nbCircle) nbCircle.setMap(null);
    nbCircle = new google.maps.Circle({
      strokeColor: '#0A0A0A', strokeOpacity: 0.45, strokeWeight: 2,
      fillColor: '#0A0A0A', fillOpacity: 0.06,
      map, center: { lat: nb.lat, lng: nb.lng }, radius: 900
    });
    animateNbCircle();
    if (NbCloseOverlayClass) {
      nbCloseOverlay = new NbCloseOverlayClass({ lat: nb.lat, lng: nb.lng }, closeNeighborhoodDetail);
      nbCloseOverlay.setMap(map);
    }
  }
  const nbIdx = PLACES.indexOf(nb);
  const keepSet = new Set([nbIdx, ...(nb.nearby || [])]);
  Object.entries(markers).forEach(([idxStr, m]) => {
    m.setMap(keepSet.has(Number(idxStr)) ? map : null);
  });
}

function closeNeighborhoodDetail(){
  detailNeighborhood = null;
  render();
  if (nbCloseOverlay) { nbCloseOverlay.setMap(null); nbCloseOverlay = null; }
  Object.values(markers).forEach(m => m.setMap(map));
  stopNbCircleAnim();
  if (nbCircle) { nbCircle.setMap(null); nbCircle = null; }
  map.panTo({ lat: 35.6812, lng: 139.7180 });
  map.setZoom(12);
}

function buildCard(place, key){
  const idx = PLACES.indexOf(place);
  const cat = CATEGORIES[key];
  const card = document.createElement('div');
  card.className = 'card';
  const meta = cat.emoji + ' ' + cat.label;
  card.innerHTML = `
    <div class="card-body">
      <div class="card-name">${place.n}</div>
      <div class="card-meta">${meta}</div>
      <p class="card-note">${place.note}</p>
      <a class="card-link" href="${mapsUrl(place)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open in Google Maps">${PIN_ICON}</a>
    </div>
  `;
  card.addEventListener('click', () => {
    if (place.lat != null) {
      map.panTo({ lat: place.lat, lng: place.lng });
      map.setZoom(15);
      openModal(place, idx);
    }
    if (window.innerWidth < 880) setSheetState('half');
  });
  return card;
}

function nameSizeClass(name){
  if (name.length > 26) return 'longer';
  if (name.length > 16) return 'long';
  return '';
}

function renderNeighborhoodBar(){
  const bar = document.getElementById('nbBarInner');
  enableDragScroll(bar);
  bar.innerHTML = '';
  PLACES.filter(p => p.c === 'nb').forEach(place => {
    const card = document.createElement('div');
    card.className = 'nb-card';
    card.style.background = nbColor(place);
    const count = (place.nearby || []).length;
    card.innerHTML = `
      <div class="nb-card-count">${count} spot${count === 1 ? '' : 's'}</div>
      <div class="nb-card-name">${place.n}</div>
      <div class="nb-card-jp">${place.jp || ''}</div>
    `;
    card.addEventListener('click', () => openNeighborhoodDetail(place));
    bar.appendChild(card);
  });
}

const chipsEl = document.getElementById('chips');
enableDragScroll(chipsEl);
let activeCategory = null; // null = "All"

const allChip = document.createElement('button');
allChip.className = 'chip active';
allChip.textContent = 'All';
allChip.addEventListener('click', () => {
  activeCategory = null;
  syncChipStates();
  render();
});
chipsEl.appendChild(allChip);

const chipEls = {};
Object.entries(CATEGORIES).forEach(([key, cat]) => {
  if (key === 'nb') return;
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.textContent = cat.emoji + ' ' + cat.label;
  chip.addEventListener('click', () => {
    activeCategory = (activeCategory === key) ? null : key;
    syncChipStates();
    render();
  });
  chipEls[key] = chip;
  chipsEl.appendChild(chip);
});

function syncChipStates(){
  allChip.classList.toggle('active', activeCategory === null);
  Object.entries(chipEls).forEach(([key, el]) => el.classList.toggle('active', activeCategory === key));
}

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const sheetCountDesktop = document.getElementById('sheetCountDesktop');
const sheetCountMobile = document.getElementById('sheetCountMobile');
function setCountText(t){ sheetCountDesktop.textContent = t; sheetCountMobile.textContent = t; }

function playListAnim(){
  listEl.classList.remove('list-anim');
  void listEl.offsetWidth;
  listEl.classList.add('list-anim');
}

const filterRowEl = document.getElementById('filterRow');
const EMPTY_MESSAGES = [
  '😅 Nothing saved here yet',
  '🫥 Quiet around here — nothing filed yet',
  '🧭 Uncharted territory. Nothing saved yet',
  '🍃 Nothing here yet — go find something good'
];

function render(){
  const query = searchEl.value.trim().toLowerCase();

  // Detach chips before wiping the list so the node (and its listeners) survive.
  if (chipsEl.parentElement === listEl) filterRowEl.appendChild(chipsEl);
  listEl.innerHTML = '';

  if (detailNeighborhood) {
    filterRowEl.classList.add('hidden');
    listEl.style.paddingTop = '0px';
    const nb = detailNeighborhood;

    const heroStyle = ` style="background:${nbColor(nb)}"`;
    const hero = document.createElement('div');
    hero.className = 'nb-hero-sticky';
    hero.innerHTML = `
      <div class="nb-hero"${heroStyle}>
        <button class="nb-hero-close" id="nbHeroClose" title="Back to all neighborhoods">✕</button>
        <div class="nb-hero-content">
          <div class="nb-hero-name">${nb.n}</div>
          <div class="nb-hero-jp">${nb.jp || ''}</div>
          <div class="nb-hero-note">${nb.note}</div>
        </div>
      </div>
    `;
    listEl.appendChild(hero);
    hero.querySelector('#nbHeroClose').addEventListener('click', closeNeighborhoodDetail);

    listEl.appendChild(chipsEl);
    requestAnimationFrame(() => {
      if (chipsEl.parentElement === listEl) chipsEl.style.top = hero.offsetHeight + 'px';
    });

    const nearbyIdx = nb.nearby || [];
    const byCategory = {};
    nearbyIdx.forEach(i => {
      const p = PLACES[i];
      if (activeCategory && p.c !== activeCategory) return;
      (byCategory[p.c] = byCategory[p.c] || []).push(p);
    });

    const anyResults = Object.keys(byCategory).length > 0;
    if (!anyResults) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = EMPTY_MESSAGES[Math.floor(Math.random() * EMPTY_MESSAGES.length)];
      listEl.appendChild(empty);
      playListAnim();
      return;
    }

    Object.entries(CATEGORIES).forEach(([key, cat]) => {
      if (key === 'nb' || !byCategory[key]) return;
      const sec = document.createElement('div');
      sec.className = 'section-label';
      sec.textContent = cat.emoji + ' ' + cat.label;
      listEl.appendChild(sec);
      byCategory[key].forEach(place => listEl.appendChild(buildCard(place, key)));
    });

    playListAnim();
    return;
  }

  filterRowEl.classList.remove('hidden');
  listEl.style.paddingTop = '';

  let total = 0;

  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    if (key === 'nb') return;
    if (activeCategory && activeCategory !== key) return;
    const items = PLACES.filter(p => {
      const matches = !query || p.n.toLowerCase().includes(query) || p.note.toLowerCase().includes(query) || cat.label.toLowerCase().includes(query);
      return p.c === key && matches;
    });
    if (items.length === 0) return;
    total += items.length;

    const sec = document.createElement('div');
    sec.className = 'section-label';
    sec.textContent = cat.emoji + ' ' + cat.label;
    listEl.appendChild(sec);

    items.forEach(place => listEl.appendChild(buildCard(place, key)));
  });

  if (total === 0) {
    listEl.innerHTML = `<div class="empty">${EMPTY_MESSAGES[Math.floor(Math.random() * EMPTY_MESSAGES.length)]}</div>`;
  }
  playListAnim();
}

searchEl.addEventListener('input', render);
searchEl.addEventListener('focus', () => { if (window.innerWidth < 880) setSheetState('full'); });

// Logo click resets the whole app to its default state: no modal, no neighborhood
// detail, no filters/search, map recentered, and drawer back to its resting position.
function resetToDefault(){
  closeModal();
  detailNeighborhood = null;
  activeCategory = null;
  searchEl.value = '';
  syncChipStates();
  if (nbCloseOverlay) { nbCloseOverlay.setMap(null); nbCloseOverlay = null; }
  Object.values(markers).forEach(m => m.setMap(map));
  stopNbCircleAnim();
  if (nbCircle) { nbCircle.setMap(null); nbCircle = null; }
  map.panTo({ lat: 35.6812, lng: 139.7180 });
  map.setZoom(12);
  render();
  setSheetState('peek');
}
document.getElementById('brandLogo').addEventListener('click', resetToDefault);

// Typing-animated placeholder suggestions
const SUGGESTION_POOL = [
  ...PLACES.filter(p => p.c === 'nb').map(p => p.n),
  ...Object.entries(CATEGORIES).filter(([k]) => k !== 'nb').map(([, c]) => c.label)
];
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function userIsTyping(){ return document.activeElement === searchEl || !!searchEl.value; }

async function animatePlaceholder(){
  let current = '';
  searchEl.placeholder = 'Search…';
  while (true) {
    await sleep(1800);
    if (userIsTyping()) continue;

    const pick = SUGGESTION_POOL[Math.floor(Math.random() * SUGGESTION_POOL.length)];
    const target = `Search "${pick}"…`;

    while (current.length > 0) {
      if (userIsTyping()) break;
      current = current.slice(0, -1);
      searchEl.placeholder = current;
      await sleep(22);
    }
    for (let i = 1; i <= target.length; i++) {
      if (userIsTyping()) break;
      current = target.slice(0, i);
      searchEl.placeholder = current;
      await sleep(42);
    }
  }
}
animatePlaceholder();

const sheet = document.getElementById('sheet');
const handleZone = document.getElementById('handleZone');

function isFull(){ return sheet.classList.contains('state-full'); }

function setSheetState(state){
  if (window.innerWidth >= 880) return;
  sheet.classList.remove('state-half','state-full');
  if (state === 'half') sheet.classList.add('state-half');
  if (state === 'full') sheet.classList.add('state-full');
  sheet.style.transform = '';
}

  dragStartTranslate = getCurrentTranslate();
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('touchmove', onPointerMove, {passive:false});
  window.addEventListener('mouseup', onPointerUp);
  window.addEventListener('touchend', onPointerUp);
}
function onPointerMove(e){
  if (!dragging) return;
  if (e.cancelable) e.preventDefault();
  const y = (e.touches?e.touches[0].clientY:e.clientY);
  const next = Math.max(0, dragStartTranslate + (y - dragStartY));
  sheet.style.transform = `translateY(${next}px)`;

  if (!dragging) return;
  dragging = false; sheet.classList.remove('dragging');
  window.removeEventListener('mousemove', onPointerMove);
  window.removeEventListener('touchmove', onPointerMove);

  // (e.g. opening a neighborhood) but isn't a resting point for a user's own drag gesture,
  // so one pull always reaches the top instead of stalling halfway.

  points.forEach(pt => { const d=Math.abs(pt.y-y); if(d<best){best=d;closest=pt;} });

handleZone.addEventListener('mousedown', onPointerDown);
handleZone.addEventListener('touchstart', onPointerDown, {passive:true});

// List area and filter row also initiate a sheet-drag when not fully expanded,
// so the whole drawer (not just the handle) is a valid drag surface.
listEl.addEventListener('mousedown', (e) => { if (!isFull()) onPointerDown(e); });
listEl.addEventListener('touchstart', (e) => { if (!isFull()) onPointerDown(e); }, {passive:true});
filterRowEl.addEventListener('mousedown', (e) => { if (!isFull()) onPointerDown(e); });
filterRowEl.addEventListener('touchstart', (e) => { if (!isFull()) onPointerDown(e); }, {passive:true});

setSheetState('peek');
